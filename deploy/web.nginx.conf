# Раздача статики веб-клиента и прокси запросов к API внутри сети compose.
server {
    listen 80;

    # Все запросы /api/... уходят в FastAPI-сервис (сервис api, порт 8000)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: несуществующие пути отдаём index.html, чтобы работал клиентский роутинг
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
