# Инфраструктура веб-сервиса черновиков Avito: PostgreSQL + FastAPI API + веб-клиент.
# Запуск: docker compose up -d          (всё вместе, включая лоадер db-load)
#         docker compose up -d db       (только база данных)
#         docker compose run --rm db-load (повторить загрузку case_ads вручную)
services:
  db:
    image: postgres:18-alpine
    container_name: avito-db
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito
      POSTGRES_DB: avito
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Инициализация схемы и справочника микрокатегорий при первом старте
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # api ждёт db только когда эта проверка проходит
      test: ["CMD-SHELL", "pg_isready -U avito -d avito"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Одноразовый лоадер датасета кейса: при каждом docker compose up исполняет
  # CMD образа — src/api/dataset_loader.py (таблица case_ads для /api/dataset/*)
  # — и завершается (restart: "no"). Загрузка идемпотентна: UNIQUE row_key +
  # ON CONFLICT DO NOTHING, повторный up не создаёт дублей.
  # Образ отдельный и лёгкий (deploy/db-load.Dockerfile): лоадеру не нужны
  # torch/CUDA и web-стек, которые ставит полный uv sync для api.
  db-load:
    build:
      context: .
      dockerfile: deploy/db-load.Dockerfile
    container_name: avito-db-load
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Подключение src/api/dataset_loader.py (asyncpg) внутри сети compose.
      # env_file не нужен: database_url берётся из DATABASE_URL, остальные
      # поля Settings() имеют значения по умолчанию (см. src/api/config.py).
      DATABASE_URL: postgresql://avito:avito@db:5432/avito
    volumes:
      # dataset_loader.py читает файлы кейса относительно корня проекта (/app):
      # монтируем только нужный каталог, docs/ в образ не копируется.
      - ./docs/innoglobalhack_avito:/app/docs/innoglobalhack_avito:ro

  api:
    # Лёгкий образ только под RuModernBERT-классификатор (lexical.remont_mc_v04):
    # onnxruntime + tokenizers + numpy на CPU, без torch/CUDA/scikit-learn и без
    # кода/весов других классификаторов. Тяжёлый deploy/api.Dockerfile остаётся
    # в репозитории как legacy (для полных сборок со всеми модулями).
    build:
      context: .
      dockerfile: deploy/api-rumodernbert.Dockerfile
    container_name: avito-api
    env_file: .env
    environment:
      # Внутри сети compose база доступна по сервисному имени db
      DATABASE_URL: postgresql://avito:avito@db:5432/avito
      # Модель работает отдельно на хосте, не внутри контейнера API.
      LOCAL_LLM_API_URL: ${LOCAL_LLM_API_URL:-http://host.docker.internal:8080/v1/chat/completions}
      LOCAL_LLM_MODEL_ID: ${LOCAL_LLM_MODEL_ID:-default_model}
      LOCAL_LLM_TIMEOUT: ${LOCAL_LLM_TIMEOUT:-180}
      LOCAL_LLM_MAX_TOKENS: ${LOCAL_LLM_MAX_TOKENS:-4096}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Датасет кейса для эндпоинтов /api/dataset/* и лоадера (см. README).
      - ./data:/app/data:ro

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    container_name: avito-web
    depends_on:
      - api
    ports:
      # Хост-порт веб-клиента: 8081 (8080 на машине занят другим сервисом).
      # Настраивается переменной WEB_PORT из окружения или файла .env.
      - "${WEB_PORT:-8081}:80"
