[project]
name = "hackathon-innoglobalhack-avito"
version = "0.1.0"
description = "Выделение услуг из объявлений Авито и генерация черновиков"
readme = "README.md"
authors = [
    { name = "ZolotarevAlexandr", email = "Zolotarev10032006@mail.ru" },
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pyarrow>=23",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1",
    "scikit-learn>=1.9.1",
    "psycopg[binary]>=3.3.9",
    "safetensors>=0.4",
    "torch>=2.6,<3",
    "transformers>=4.45,<5",
    "uvicorn>=0.54.0",
    "onnxruntime>=1.17",
    "tokenizers>=0.21,<0.24",
    "regex",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pandas>=3.1.1",
]
