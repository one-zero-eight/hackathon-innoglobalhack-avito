[project]
name = "hackathon-innoglobalhack-avito"
version = "0.1.0"
description = "Выделение услуг из объявлений Авито и генерация черновиков"
readme = "README.md"
authors = [
    { name = "ZolotarevAlexandr", email = "Zolotarev10032006@mail.ru" },
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "python-dotenv>=1",
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = [
    "src/subcategory_extraction",
    "src/category_validation",
    "src/draft_generation",
]
